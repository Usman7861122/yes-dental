name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

env:
  AWS_REGION: us-east-1
  S3_BUCKET: yes-dental-website
  AWS_ROLE_ARN: arn:aws:iam::408421298613:role/github-yes-dental-deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

  deploy:
    # Only deploys from main (never from pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed to log in to AWS without stored keys
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      # Temporary: shows which identity GitHub presents to AWS (claims only, never the token)
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | python3 -c "
          import sys,json,base64
          p=sys.stdin.read().strip().split('.')[1]
          p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ('iss','aud','sub','repository','repository_owner','ref','job_workflow_ref'):
              print(k,'=',c.get(k))
          "

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed asset files can be cached for a long time
      - name: Upload assets
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --exclude "*.html" --exclude "sitemap*" \
            --cache-control "public,max-age=31536000,immutable"

      # Pages are re-checked every time, then old files are removed
      - name: Upload pages
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --exclude "*" --include "*.html" --include "sitemap*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete
