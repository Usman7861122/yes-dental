name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

env:
  AWS_REGION: us-east-1
  S3_BUCKET: yes-dental-website
  AWS_ROLE_ARN: arn:aws:iam::408421298613:role/github-yes-dental-deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run build
        env:
          PUBLIC_FORM_ENDPOINT: https://lrldwxpaku65lq2jzrw7q5xvpy0cykqq.lambda-url.us-east-1.on.aws/

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

  deploy:
    # Only deploys from main (never from pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed to log in to AWS without stored keys
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Build files in _astro/ have a hash in their name, so they can be cached for a year
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/_astro "s3://$S3_BUCKET/_astro" \
            --cache-control "public,max-age=31536000,immutable"

      # Logo, favicons and share image keep the same file name when they change, so cache them for 30 days
      - name: Upload images, fonts and icons
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --exclude "_astro/*" --exclude "*.html" --exclude "*.xml" --exclude "*.txt" \
            --cache-control "public,max-age=2592000"

      # Pages, sitemap and robots.txt are re-checked on every visit. Old pages are removed.
      - name: Upload pages, sitemap and robots.txt
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete
